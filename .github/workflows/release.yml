name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            asset_name: UnityModTool-windows-x64
          - runner: ubuntu-latest
            rid: linux-x64
            asset_name: UnityModTool-linux-x64
          - runner: macos-latest
            rid: osx-x64
            asset_name: UnityModTool-macos-x64
          - runner: macos-latest
            rid: osx-arm64
            asset_name: UnityModTool-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained application
        run: dotnet publish ./UnityModTool/UnityModTool.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish

      - name: Create zip archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: Compress-Archive -Path "publish/*" -DestinationPath "$env:ASSET_NAME.zip"

      - name: Create zip archive (Unix)
        if: runner.os != 'Windows'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          cd publish
          zip -r "../$ASSET_NAME.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: UnityModTool-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
