name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            asset_name: UnityModTool-windows-x64
          - runner: ubuntu-latest
            rid: linux-x64
            asset_name: UnityModTool-linux-x64
          - runner: macos-latest
            rid: osx-x64
            asset_name: UnityModTool-macos-x64
          - runner: macos-latest
            rid: osx-arm64
            asset_name: UnityModTool-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained application
        run: dotnet publish ./UnityModTool/UnityModTool.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: publish/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: UnityModTool-*
          path: release-assets

      - name: Package release archives
        shell: bash
        run: |
          for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
            asset_name="UnityModTool-$platform"
            source_dir="release-assets/$asset_name"

            if [[ "$platform" != windows-* ]]; then
              chmod +x "$source_dir/UnityModTool"
            fi

            (cd "$source_dir" && zip -qr "$GITHUB_WORKSPACE/$asset_name.zip" .)
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: UnityModTool-*.zip
